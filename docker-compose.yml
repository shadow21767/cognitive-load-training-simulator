services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: human_performance
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d human_performance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@db:5432/human_performance
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@db:5432/human_performance
      API_BASE_URL: http://localhost:8000
      RESEARCHER_USERNAME: admin
      RESEARCHER_PASSWORD: change-me
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
